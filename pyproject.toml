[project]
name = "kyc-kie"
version = "0.1.0"
description = "Raw OCR text of Khmer ID cards, passports and visas to structured JSON (BiGRU-CRF tagger + rules, ONNX)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "onnxruntime"]

[project.scripts]
kyc-kie = "kyc_kie.infer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyc_kie"]
